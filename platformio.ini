[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CBC387918-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CBC387918-if00
lib_deps = k0i05/esp_ssd1306@^1.2.7
